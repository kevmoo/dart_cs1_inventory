include: package:dart_flutter_team_lints/analysis_options.yaml

analyzer:
  language:
    strict-raw-types: true
  exclude:
    # Item programs are deliberately "student-shaped" (unused locals, verbose
    # loops, mutable vars) and must not be lint-cleaned into unfamiliar idioms.
    - items/**/*_bad_*.dart

linter:
  rules:
    - avoid_void_async
    - missing_whitespace_between_adjacent_strings
    - no_adjacent_strings_in_list
    - use_declaring_parameters
    - use_primary_constructors
