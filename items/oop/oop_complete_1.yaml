id: oop_complete_1
concept: oop
type: completion
dag_node: methods_and_this
prompt: |
  Fill in the blank so the program prints `5`.
code_file: oop_complete_1.dart
template: |
  class Counter {
    int count;

    Counter(this.count);

    void bump() {
      ____
    }
  }

  void main() {
    var c = Counter(3);
    c.bump();
    c.bump();
    print(c.count);
  }
options:
  - id: a
    text: "this.count += 1;"
    rationale: "`this.count` is the object's field, so each call adds 1 to the value that `main` later reads."
  - id: b
    text: "var count = this.count + 1;"
    rationale: Declares a local variable that shadows the field and vanishes when `bump()` returns; the field stays 3.
    misconception: scope.local_shadows_field
  - id: c
    text: "print(count + 1);"
    rationale: Prints instead of changing the field, so the output is `4`, `4`, then `3`.
    misconception: output.print_as_computation
  - id: d
    text: "c.count += 1;"
    rationale: Refers to `main`'s variable `c`, which is not in scope inside the class; the analyzer reports `undefined_identifier`.
    compile_error: true
    diagnostic: undefined_identifier
    misconception: scope.outer_local_visible
answer: a
spec_areas: [classes.instance_methods, classes.instance_variables, expressions.this, expressions.assignment, expressions.identifier_reference, expressions.method_invocation, statements.print]
dart_notes: >-
  Inside a method a bare `count` already means `this.count`; the key uses
  `this.` explicitly so the item stays about field-vs-local, not about Dart's
  implicit `this`.
