# Dart language spec areas used for coverage mapping.
#
# `reference` is either a `Section › Subsection` title path from
# dart-lang/language `specification/dartLangSpec.tex` (titles are stable across
# editions; section *numbers* are not, so they are deliberately omitted), or a
# path under dart-lang/language `accepted/<version>/` for features that live in
# a feature specification rather than the main spec text.
#
# `cs1_scope: true` marks areas the FCS1/SCS1 concept list would exercise in any
# language. Everything else is a candidate gap for a Dart-specific inventory.
# Actual coverage is computed from `items/**/*.yaml` by `tool/report.dart`.
areas:
  # ---------------------------------------------------------------- CS1 scope
  - id: variables
    title: Variables (declaration, initialization, `var`/`final`)
    reference: Variables
    group: Fundamentals
    cs1_scope: true
  - id: statements.local_variable
    title: Local variable declaration
    reference: Statements › Local Variable Declaration
    group: Fundamentals
    cs1_scope: true
  - id: expressions.numbers
    title: Numeric literals, `int` vs `double`
    reference: Expressions › Numbers
    group: Fundamentals
    cs1_scope: true
    note: Pseudocode has one "number" type; Dart's `int`/`double` split and `~/` vs `/` is a translation hazard.
  - id: expressions.strings
    title: String literals and interpolation
    reference: Expressions › Strings
    group: Fundamentals
    cs1_scope: true
    note: FCS1 uses string output in prompts only; Dart items need `'$x'` interpolation to print.
  - id: expressions.booleans
    title: Boolean literals
    reference: Expressions › Booleans
    group: Logical operators
    cs1_scope: true
  - id: expressions.assignment
    title: Assignment and compound assignment (`=`, `+=`)
    reference: Expressions › Assignment
    group: Fundamentals
    cs1_scope: true
  - id: expressions.additive
    title: Additive expressions (`+`, `-`)
    reference: Expressions › Additive Expressions
    group: Fundamentals
    cs1_scope: true
  - id: expressions.multiplicative
    title: Multiplicative expressions (`*`, `/`, `~/`, `%`)
    reference: Expressions › Multiplicative Expressions
    group: Fundamentals
    cs1_scope: true
  - id: expressions.unary
    title: Unary expressions (`-x`, `!b`, prefix `++`)
    reference: Expressions › Unary Expressions
    group: Fundamentals
    cs1_scope: true
  - id: expressions.postfix
    title: Postfix expressions (`i++`, `i--`)
    reference: Expressions › Postfix Expressions
    group: Fundamentals
    cs1_scope: true
  - id: expressions.relational
    title: Relational expressions (`<`, `<=`, `>`, `>=`)
    reference: Expressions › Relational Expressions
    group: Logical operators
    cs1_scope: true
  - id: expressions.equality
    title: Equality (`==`, `!=`)
    reference: Expressions › Equality
    group: Logical operators
    cs1_scope: true
  - id: expressions.logical
    title: Logical boolean expressions (`&&`, `||`, short-circuit)
    reference: Expressions › Logical Boolean Expressions
    group: Logical operators
    cs1_scope: true
  - id: expressions.function_invocation
    title: Function invocation and binding actuals to formals
    reference: Expressions › Function Invocation › Binding Actuals to Formals
    group: Functions
    cs1_scope: true
  - id: expressions.identifier_reference
    title: Identifier reference and lexical scope
    reference: Expressions › Identifier Reference
    group: Functions
    cs1_scope: true
    note: Shadowing (a parameter named like a global) is the spec hook for the classic FCS1 scope question.
  - id: expressions.lists
    title: List literals
    reference: Expressions › Collection Literals › Lists
    group: Arrays
    cs1_scope: true
  - id: expressions.index
    title: Index access and index assignment (`a[i]`, `a[i] = v`)
