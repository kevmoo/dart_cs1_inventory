id: selection_complete_1
concept: selection
type: completion
dag_node: selection
prompt: |
  For each `n` from 1 to 5 the program should add one letter: `B` when
  `n` is above 3, otherwise `M` when `n` is above 1, otherwise `S`. Fill in
  the blank so it prints `SMMBB`.
code_file: selection_complete_1.dart
template: |
  void main() {
    var line = '';
    for (var n = 1; n <= 5; n++) {
      if (n > 3) {
        line += 'B';
      } ____ {
        line += 'M';
      } else {
        line += 'S';
      }
    }
    print(line);
  }
options:
  - id: a
    text: "else if (n > 1)"
    rationale: Chains the branches so exactly one letter is added per `n`.
  - id: b
    text: "if (n > 1)"
    rationale: Makes an independent `if`, so for n = 4 and 5 both `B` and `M` are added; prints `SMMBMBM`.
    misconception: if.chain_as_independent
  - id: c
    text: "else if (n >= 1)"
    rationale: Chain is right but the bound is inclusive, so n = 1 gets `M` instead of `S`; prints `MMMBB`.
    misconception: bool.strict_vs_inclusive
  - id: d
    text: "else (n > 1)"
    rationale: "`else` cannot take a condition; the analyzer reports `expected_token` (Expected to find ';')."
    compile_error: true
    diagnostic: expected_token
    misconception: if.else_with_condition
answer: a
spec_areas: [statements.if, statements.blocks, expressions.relational, statements.for, statements.print]
dart_notes: >-
  A short loop is used so the independent-`if` distractor is observably
  different from the chain; with a single fixed value the two are
  indistinguishable for most inputs.
