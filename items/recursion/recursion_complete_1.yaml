id: recursion_complete_1
concept: recursion
type: completion
prompt: |
  Fill in the blank so the program prints `6`.
code_file: recursion_complete_1.dart
template: |
  int sumTo(int n) {
    if (____) {
      return 0;
    }
    return n + sumTo(n - 1);
  }

  void main() {
    print(sumTo(3));
  }
options:
  - id: a
    text: "n == 1"
    rationale: Stops one step early, so the 1 is never added; prints `5`.
  - id: b
    text: "n > 0"
    rationale: Writes the condition for the recursive case instead of the base case, so `sumTo(3)` returns 0 immediately.
  - id: c
    text: "n == 0"
    rationale: Stops when there is nothing left to add; 3 + 2 + 1 + 0 = 6.
  - id: d
    text: "n = 0"
    rationale: Uses assignment instead of comparison; `n = 0` is an `int`, not a `bool`, so the analyzer reports `non_bool_condition`.
    compile_error: true
answer: c
spec_areas: [expressions.function_invocation, statements.return, statements.if, expressions.equality, expressions.relational, statements.print]
dart_notes: >-
  `n <= 0` was rejected as a distractor because it is behaviourally correct
  here; `n = 0` compiles silently in some pseudocode dialects but is a type
  error in Dart.
