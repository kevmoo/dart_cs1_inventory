id: fundamentals_trace_4
concept: fundamentals
type: tracing
dag_node: variables_assignment
prompt: |
  What does this program print?
code_file: fundamentals_trace_4.dart
options:
  - id: a
    text: "10\n10\n5"
    rationale: Ignores `points = bonus`, treating the initial value of `points` as permanent.
    misconception: assign.first_value_permanent
  - id: b
    text: "10\n5\n5"
    rationale: "`points` starts at 10; `points = bonus` copies `5` into `points`, while `bonus` stays `5`."
  - id: c
    text: "10\n5\n10"
    rationale: Believes `points = bonus` swaps the two variables; it only overwrites `points` with a copy of `bonus`.
    misconception: assign.swap
  - id: d
    text: "10\n10\n10"
    rationale: Reads `points = bonus` right to left as "`bonus` gets `points`"; the value on the right is copied into the variable on the left.
    misconception: assign.right_to_left
answer: b
spec_areas: [statements.local_variable, expressions.assignment, statements.expression, statements.print]
dart_notes: >-
  Each `print` shows the variable's value at that point in the program;
  `points = bonus` copies the current value of `bonus` into `points` without
  changing `bonus`.
