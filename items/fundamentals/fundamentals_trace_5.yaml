id: fundamentals_trace_5
concept: fundamentals
type: tracing
dag_node: output_and_strings
prompt: |
  What does this program print?
code_file: fundamentals_trace_5.dart
options:
  - id: a
    text: "7\n7\n7: 7"
    rationale: Believes the word `score` inside quotes is replaced by the variable's value even without a `$`.
    misconception: output.bare_name_interpolates
  - id: b
    text: "score\n7\nscore: $score"
    rationale: Does not know that `$score` inside a string is replaced by the value of `score` (string interpolation).
    misconception: output.no_interpolation
  - id: c
    text: "score\n7\nscore: 7"
    rationale: "`'score'` in quotes is plain text, unquoted `score` reads the variable `7`, and `$score` substitutes `7` inside the string."
  - id: d
    text: "'score'\n7\n'score: 7'"
    rationale: Believes `print` outputs the quote marks around a string literal; quotes only mark where the string starts and ends in the code.
    misconception: output.quotes_printed
answer: c
spec_areas: [expressions.strings, statements.local_variable, statements.print]
dart_notes: >-
  Contrasts a quoted word (`'score'`), an unquoted variable (`score`), and
  an interpolated variable (`'$score'`) without mixing in numeric strings.
