  - id: b
    text: "down 2\ndown 1\nup 1\nup 2"
    rationale: Lines before the recursive call print on the way in (2, then 1); lines after it print only once each inner call has returned, so in reverse order.
  - id: c
    text: "down 2\ndown 1"
    rationale: Assumes the base case's `return` ends the whole program, so nothing after any recursive call runs.
    misconception: return.exits_program
  - id: d
    text: "down 2\ndown 1\nup 2\nup 1"
    rationale: Knows the `up` lines come after, but prints them in call order rather than in return order.
    misconception: recursion.unwind_order
